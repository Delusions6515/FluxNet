name: Release

on:
  workflow_dispatch:
    inputs:
      kernel-channel:
        description: 'sing-box kernel channel'
        default: delusions6515-pre
        type: choice
        options: [delusions6515-pre, delusions6515-stable, ref1nd-pre, ref1nd-stable, official-pre, official-stable]
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build-module.yml
    with:
      abi: arm64-v8a
      kernel-channel: ${{ inputs.kernel-channel || 'delusions6515-pre' }}
      version: ''
      ref: ${{ github.ref }}
      event-name: ${{ github.event_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate release notes
        env:
          TAG: ${{ github.ref_name }}
          BUILD_TYPE: ${{ needs.build.outputs.build-type }}
        run: |
          {
            echo "## FluxNet $TAG"
            echo
            echo "**Build type:** $BUILD_TYPE"
            echo
            echo "### Changes"
            echo
            prev_tag=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
            if [ -n "$prev_tag" ]; then
              git log --oneline "$prev_tag..HEAD" -- go/ module/ build.sh
            else
              git log --oneline -- go/ module/ build.sh | head -30
            fi
            echo
            echo "[Build run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > release-notes.md

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.is-prerelease }}
        run: |
          args=(--title "FluxNet $TAG")
          [ "$PRERELEASE" = "true" ] && args+=(--prerelease --latest=false)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" "${args[@]}" --notes-file release-notes.md
            gh release upload "$TAG" dist/*.zip --clobber
          else
            gh release create "$TAG" "${args[@]}" --notes-file release-notes.md dist/*.zip
          fi

  update-json:
    name: Publish update.json
    needs: [build, release]
    if: needs.build.outputs.is-prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate update JSONs
        env:
          TAG: ${{ github.ref_name }}
          BUILD_TYPE: ${{ needs.build.outputs.build-type }}
          VERSION: ${{ needs.build.outputs.version }}
          VERSION_CODE: ${{ needs.build.outputs.version-code }}
        run: |
          version="$VERSION"
          code="$VERSION_CODE"
          sha=$(git rev-parse --short HEAD)
          mkdir -p json-out
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            zip="FluxNet-${version}-${code}-${sha}-${BUILD_TYPE}-${abi}.zip"
            cat > "json-out/update-${abi}.json" <<JSON
          {
            "version": "$version",
            "versionCode": $code,
            "zipUrl": "https://github.com/${{ github.repository }}/releases/download/$TAG/$zip",
            "changelog": "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/CHANGELOG.md"
          }
          JSON
          done

          git log --oneline -50 > json-out/CHANGELOG.md

      - name: Publish to gh-pages
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin gh-pages:gh-pages 2>/dev/null; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf --cached . >/dev/null 2>&1 || git rm -rf . >/dev/null 2>&1 || true
          fi
          cp json-out/update-*.json json-out/CHANGELOG.md .
          git add update-*.json CHANGELOG.md
          if git commit -m "update: $TAG"; then
            git push origin gh-pages
          else
            echo "update JSON and changelog unchanged; skipping push"
          fi

