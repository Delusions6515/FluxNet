# 配置（按需修改）
# 这是 AndroidTProxyShell 的用户源配置。模块会在运行时生成副本，
# 不会修改此文件。

# 代理流量标记。为空时由 AndroidTProxyShell 自动处理。
ROUTING_MARK=""
FORCE_MARK_BYPASS=0

# 透明代理监听端口。模块使用 TCP 端口生成 sing-box 入站；tproxy 模式下
# TCP 与 UDP 端口必须相同。
PROXY_TCP_PORT=1536
PROXY_UDP_PORT=1536

# 性能模式（0=普通，1=性能优化）。启用后可能启用 conntrack 等功能。
PERFORMANCE_MODE=0

# DNS 配置
# DNS 劫持方式：0=关闭，1=TPROXY，2=REDIRECT。非零值会在运行时与模块
# 代理模式对齐。
DNS_HIJACK_ENABLE=1
# DNS 监听端口
DNS_PORT=1053

# 接口定义
# 移动数据接口
MOBILE_INTERFACE="rmnet_data+"
# Wi-Fi 接口
WIFI_INTERFACE="wlan0"
# 热点接口
HOTSPOT_INTERFACE="wlan2"
# USB 网络共享接口
USB_INTERFACE="rndis+"
# 其他需要绕过或代理的接口，多个接口用空格分隔。
OTHER_BYPASS_INTERFACES=""
OTHER_PROXY_INTERFACES=""

# 代理开关
PROXY_MOBILE=1
PROXY_WIFI=1
PROXY_HOTSPOT=0
PROXY_USB=0
PROXY_TCP=1
PROXY_UDP=1

# IPv6 代理控制：
#  0 = 不代理，但 IPv6 协议栈保持启用
#  1 = 启用 IPv6 代理
# -1 = 强制关闭所有接口的 IPv6 协议栈
PROXY_IPV6=0

# 额外绕过或强制代理的网段。AndroidTProxyShell 会自行处理默认私有和本地网段。
BYPASS_IPv4_LIST=""
BYPASS_IPv6_LIST=""
PROXY_IPv4_LIST=""
PROXY_IPv6_LIST=""

# Wi-Fi 与热点共用接口时使用的热点网段（旧设备常见）。仅当
# HOTSPOT_INTERFACE 与 WIFI_INTERFACE 相同时生效。
HOTSPOT_SUBNET_IPV4="192.168.43.0/24"
HOTSPOT_SUBNET_IPV6="fe80::/10"

# 流量标记与路由表 ID。多个透明代理同时运行时应避免冲突。
MARK_VALUE=20
MARK_VALUE6=25
TABLE_ID=2025

# 中国大陆 IP 绕过配置
BYPASS_CN_IP=0
# 中国大陆 IP 列表文件名
CN_IP_FILE="cn.zone"
CN_IPV6_FILE="cn_ipv6.zone"
# 中国大陆 IP 列表下载地址
CN_IP_URL="https://raw.githubusercontent.com/Hackl0us/GeoIP2-CN/release/CN-ip-cidr.txt"
CN_IPV6_URL="https://ispip.clang.cn/all_cn_ipv6.txt"

# MAC 地址黑白名单配置（热点模式）
MAC_FILTER_ENABLE=0
# MAC 地址黑白名单，多个地址用空格分隔
PROXY_MACS_LIST=""
# 示例："AA:BB:CC:DD:EE:FF 11:22:33:44:55:66"
BYPASS_MACS_LIST=""
# 示例："FF:EE:DD:CC:BB:AA"
MAC_PROXY_MODE="blacklist"
# "blacklist" 或 "whitelist"

# 阻止 QUIC 流量
BLOCK_QUIC=0
